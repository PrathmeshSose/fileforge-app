<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page Not Found – FileForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0A0A0A;color:#F0F0F0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.icon{font-size:72px;margin-bottom:24px}
h1{font-size:48px;font-weight:900;background:linear-gradient(135deg,#fff,#4ECDC4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
p{font-size:16px;color:#777;margin-bottom:32px}
a{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#4ECDC4,#A29BFE);color:#000;font-weight:800;font-size:15px;padding:14px 30px;border-radius:14px;text-decoration:none}
a:hover{opacity:.9}
</style>
</head>
<body>
<div class="icon">📄</div>
<h1>404</h1>
<p>Oops! This page doesn't exist.</p>
<a href="/">← Go Back Home</a>
</body>
</html>
